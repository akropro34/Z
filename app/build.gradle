apply plugin: 'com.android.application'

android {
    compileSdkVersion 34
    namespace 'com.fs4ip.delta'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId "com.fs4ip.delta"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        ndkBuild {
            path file('src/main/jni/Android.mk')
        }
    }

    ndkVersion '24.0.8215888'

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
        resources {
            excludes += ['META-INF/AL2.0', 'META-INF/LGPL2.1']
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
}

// Copy library.so built by jni into app assets after NDK build
afterEvaluate {
    tasks.matching { it.name.contains('buildNdkBuild') }.each { ndkTask ->
        ndkTask.doLast {
            def soSrc = file("${buildDir}/intermediates/ndkBuild/debug/obj/local/arm64-v8a/library.so")
            def aoDst = file("src/main/assets/library.so")
            if (soSrc.exists()) {
                aoDst.parentFile.mkdirs()
                soSrc.bytes = soSrc.bytes // no-op touch
                copy { from soSrc; into aoDst.parentFile; rename { 'library.so' } }
                println ">>> Copied library.so to assets"
            }
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation project(':Bcore')
    // black-reflection: required for @BlackClass/@BlackStrClass annotation processing
    implementation project(':black-reflection')
    annotationProcessor project(':compiler')
}
